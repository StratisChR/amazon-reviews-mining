[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "reviews-mining"
version = "1.0.0"
description = "Data mining on Amazon Reviews 2023: text preprocessing, exploratory analysis, product clustering, recommendation and sentiment classification."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas>=2.0",
    "pyarrow",
    "scipy",
    "scikit-learn>=1.3",
    "spacy>=3.7",
    "spacy-lookups-data",
    "vaderSentiment",
    "gensim>=4.3",
    "matplotlib",
]

[project.optional-dependencies]
notebook = ["jupyter", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]
